{% load static %}
<!DOCTYPE html>
<html lang="en" data-beasties-container>
    <head>
        <meta charset="utf-8" />
        <title>Open Educational Badges Dashboard</title>
        <link rel="stylesheet" href="{{ asset_path }}oeb-dashboard/styles.css" media="print" onload="this.media='all'" />
        <noscript>
            <link rel="stylesheet" href="{{ asset_path }}oeb-dashboard/styles.css" />
        </noscript>
        <script>
            window.OEBWebComponentSettings = {
                language: "{{ language }}",
            };
        </script>
    </head>
    <body>
        <oeb-dashboard id="dashboard" baseurl="{{ asset_path }}oeb-dashboard/"></oeb-dashboard>
        <script src="{{ asset_path }}oeb-dashboard/polyfills.js" type="module"></script>
        <script src="{{ asset_path }}oeb-dashboard/main.js" type="module"></script>
        <script type="text/javascript">
            document.addEventListener("DOMContentLoaded", () => {
                const el = document.getElementById("dashboard");
                el.issuerSlug = "{{ issuer_slug|escapejs }}";
                el.accessToken = "{{ token|escapejs }}";
            });
        </script>
    </body>
</html>
